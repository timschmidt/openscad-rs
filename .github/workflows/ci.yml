name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Fetch the pinned csgrs monorepo
        # hyperreal is a path dependency on the sibling csgrs monorepo.
        run: |
          set -euo pipefail
          destination="${GITHUB_WORKSPACE}/../csgrs"
          git init "${destination}"
          git -C "${destination}" remote add origin https://github.com/timschmidt/csgrs.git
          git -C "${destination}" fetch --depth 1 origin e83de9ee8c8fc368f0edd9789300c533fdeefbfd
          git -C "${destination}" checkout --detach FETCH_HEAD
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Test
        run: cargo test
      - name: Check fuzz targets
        run: cargo check --manifest-path fuzz/Cargo.toml --bins --locked

  compat:
    name: OpenSCAD Compat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false
      - name: Fetch the pinned csgrs monorepo
        # hyperreal is a path dependency on the sibling csgrs monorepo.
        run: |
          set -euo pipefail
          destination="${GITHUB_WORKSPACE}/../csgrs"
          git init "${destination}"
          git -C "${destination}" remote add origin https://github.com/timschmidt/csgrs.git
          git -C "${destination}" fetch --depth 1 origin e83de9ee8c8fc368f0edd9789300c533fdeefbfd
          git -C "${destination}" checkout --detach FETCH_HEAD
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Compat tests
        env:
          OPENSCAD_COMPAT_REQUIRED: "1"
        run: cargo test --test openscad_compat -- --nocapture
