[package]
name = "openscad-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
openscad-rs = { path = ".." }

[[bin]]
name = "fuzz_lexer"
path = "fuzz_targets/fuzz_lexer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_parser"
path = "fuzz_targets/fuzz_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_structured_parser"
path = "fuzz_targets/fuzz_structured_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_numeric_literals"
path = "fuzz_targets/fuzz_numeric_literals.rs"
test = false
doc = false
bench = false
